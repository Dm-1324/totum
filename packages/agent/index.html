<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The agent page loads exactly one script (its own bundle) and nothing else.
      connect-src 'none' until milestone 3 allows only the model API host.
      The agent session's webRequest filter enforces the same as a second layer.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Totum agent</title>
  </head>
  <body>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
